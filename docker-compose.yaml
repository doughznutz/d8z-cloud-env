# The d8z-cloud-environment: a dood gateway (Traefik + its gw-server console)
# and a Deightz IDE, shipped as named images in one Docker Hub repository so
# the same system runs locally or on a cloud VM.
#
# Two kinds of service live here, kept strictly apart:
#
#   *-dh services (profile `dh`) only BUILD the Docker Hub bound images.
#   They're never started. Build them with
#       docker compose --profile dh build
#   and gw-server's Deployment page pushes them (see ~/.d8z/deployment.yaml):
#       dood-dh -> ${DOCKER_HUB_USERNAME}/${DOCKER_HUB_REPO}:dood
#       deightz-dh -> ${DOCKER_HUB_USERNAME}/${DOCKER_HUB_REPO}:d8z
#
#   Runtime services USE those images (no `build:`): pulled from Docker Hub,
#   or the local copy a `dh` build just tagged. Profiles pick the system:
#       docker compose --profile root up -d        - dood only
#       docker compose --profile workspace up -d   - dood + deightz
#   Set COMPOSE_PROFILES=root (or workspace) in .env to make it the default.
#
#   Optional services (og, gopher, dozzle) are started on demand from the
#   console's Control tab in either configuration - each has its own profile
#   so gw-server can start exactly one (gopher's profile brings up its
#   gopher-agents with it). They still build from source (the dood image
#   carries the repo in /self, so that works in the cloud too).
#
# The `dind` service is only an extends-template for a spawned gateway
# bundle's sidecar (dev/dood/bundle/compose.yaml); nothing starts it here.

services:
  # ---------------------------------------------------------------------
  # Docker Hub bound builds (profile dh) - build only, never `up`.
  # ---------------------------------------------------------------------

  # Context is the repo root: the image carries the repo in /self to start
  # optional services and child bundles from, and to seed new projects.
  dood-dh:
    image: ${DOCKER_HUB_USERNAME}/${DOCKER_HUB_REPO}:dood
    profiles: [dh]
    build:
      context: .
      dockerfile: ./dev/dood/Dockerfile

  # Deightz - streamlined IDE: linuxserver/code-server + claude/codex/gemini/
  # continue CLIs. Published as the `d8z` container.
  deightz-dh:
    image: ${DOCKER_HUB_USERNAME}/${DOCKER_HUB_REPO}:d8z
    profiles: [dh]
    build:
      context: ./dev/deightz

  # console-next - the TypeScript front door fronting dood's root gateway
  # (multi-user auth, key store, direct NATS). Context is the repo root: it
  # reuses gw-server's generated types.gen.ts the same way dood-dh does.
  console-next-dh:
    image: ${DOCKER_HUB_USERNAME}/${DOCKER_HUB_REPO}:console-next
    profiles: [dh]
    build:
      context: .
      dockerfile: ./dev/dood/console-next/Dockerfile

  # ---------------------------------------------------------------------
  # Runtime: profiles root / workspace, from the Docker Hub images.
  # ---------------------------------------------------------------------

  # Dood is the front door (root gateway): Traefik + gw-server. Traefik
  # terminates :80, applies basic auth, serves the React console at `/` and
  # routes /deightz /og /dozzle /gopher per dev/dood/dynamic/base.yml. Its gw-server is the cluster's
  # control plane: workspace gateways (child bundles), optional services,
  # Docker Hub builds/pushes and cloud deployments (deployment.yaml).
  dood:
    image: ${DOCKER_HUB_USERNAME}/${DOCKER_HUB_REPO}:dood
    pull_policy: missing
    profiles: [root, workspace]
    container_name: dood
    env_file: ./.env   # passed on to child bundles (regenerated as /self/.env)
    environment:
      - DOUGHZNUTZ_USER=${USER}
      - DOUGHZNUTZ_PASSWORD=${DOCKER_PASSWORD}
      # Reachable from the console-next sibling container below (internal_net/
      # external_net) instead of loopback-only - mirrors how the NATS plain
      # client port is already unauthenticated-by-design on internal_net
      # (server/nats.go). gw-server itself still has no auth of its own;
      # console-next's own session/API-key auth is what actually gates it
      # now that Traefik's basicAuth no longer fronts the console router.
      - GW_LISTEN=0.0.0.0:8000
      - GW_ROLE=root
      # This gateway's NATS identity. "root" locally; a cloud deployment
      # sets its target name so the local root can address it.
      - GW_ID=${GW_ID:-root}
      - GW_PROJECTS_ROOT=/home/${USER}/projects
      # Leafnode auth: required when the leaf port is reachable from outside
      # (a cloud gateway); blank keeps the local, internal-only behaviour.
      - GW_NATS_LEAF_USER=${GW_NATS_LEAF_USER:-}
      - GW_NATS_LEAF_PASSWORD=${GW_NATS_LEAF_PASSWORD:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/$USER/projects:/home/$USER/projects
      # Gateway config, kept on the host OUTSIDE every repository so it
      # survives any rebuild: workspace.yaml (GitHub tokens),
      # deployment.yaml (Docker Hub / cloud keys) and .gw-master-key.
      # Create it yourself first (mkdir -m 700 ~/.d8z) so it's yours, not
      # root's. D8Z_CONFIG_DIR moves it elsewhere.
      - ${D8Z_CONFIG_DIR:-/home/$USER/.d8z}:/etc/d8z
      # Embedded NATS JetStream store (dev/dood/server/nats.go). One
      # volume per bundle - bundle/compose.yaml re-declares the same name.
      - d8z-nats:/var/lib/d8zgw-nats
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      # NATS leafnode listener. Loopback-only by default; a cloud gateway
      # sets GW_NATS_PUBLISH=7422 so its parent can dial in (with auth).
      - "${GW_NATS_PUBLISH:-127.0.0.1:7422}:7422"
      # NATS plain client listener (dev/dood/server/nats.go). Unauthenticated,
      # so loopback-only by default; other containers (e.g. gopher's chat
      # tab) reach it over internal_net as dood:4222 without this publish.
      - "${GW_NATS_CLIENT_PUBLISH:-127.0.0.1:4222}:4222"
    networks:
      internal_net:
      external_net: {}   # internal_net alone is `internal: true` and silently drops the port publish

  # console-next - the TypeScript front door: terminates auth (replacing
  # Traefik's basicAuth on the console router - dynamic/base.yml), owns the
  # user/session/API-key/credential store, and talks to gw-server (above)
  # and its embedded NATS directly. Only fronts the root for now; a child
  # bundle still serves gw-server directly, unchanged.
  console-next:
    image: ${DOCKER_HUB_USERNAME}/${DOCKER_HUB_REPO}:console-next
    pull_policy: missing
    profiles: [root, workspace]
    container_name: console-next
    depends_on: [dood]
    environment:
      - GW_TARGET=http://dood:8000
      - CN_NATS_URL=dood:4222
      - CN_LISTEN=0.0.0.0:8787
      - CN_DB_FILE=/etc/d8z/console-next.db
      - CN_MASTER_KEY_FILE=/etc/d8z/.console-next-master-key
      # Seeds the first admin account from the same identity Traefik's
      # basicAuth used to gate on - so the swap-over doesn't lock anyone
      # out. A no-op once that account exists (src/auth/bootstrap.ts).
      - CN_ADMIN_USER=${USER}
      - CN_ADMIN_PASSWORD=${PASSWORD}
    volumes:
      # Same host dir as dood's /etc/d8z - console-next's db/master-key live
      # alongside workspace.yaml/deployment.yaml, outside every checkout.
      - ${D8Z_CONFIG_DIR:-/home/$USER/.d8z}:/etc/d8z
    networks:
      - internal_net
      - external_net

  # Deightz IDE, mounting this .env's PROJECT. The console opens it at
  # /deightz/.
  deightz:
    image: ${DOCKER_HUB_USERNAME}/${DOCKER_HUB_REPO}:d8z
    pull_policy: missing
    profiles: [workspace]
    container_name: deightz
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PASSWORD=${CODE_SERVER_PASSWORD}
      - SUDO_PASSWORD=${DOCKER_PASSWORD}
      - DEFAULT_WORKSPACE=/home/${USER}/projects/${PROJECT}
    env_file: ./.env
    volumes:
      - /home/$USER/projects/$PROJECT:/home/$USER/projects/$PROJECT
      - /var/run/docker.sock:/var/run/docker.sock # For DinD
    privileged: true
    networks:
      - internal_net
      - external_net

  # ---------------------------------------------------------------------
  # Optional services - started on demand from the console's Control tab.
  # ---------------------------------------------------------------------

  # A Docker log watcher.
  dozzle:
    image: amir20/dozzle
    profiles: [dozzle]
    container_name: dozzle
    environment:
      - DOZZLE_BASE=/dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal_net
      - external_net

  # Ollama Gateway - local Ollama runtime + Streamlit dashboard.
  og:
    image: dev:og
    profiles: [og]
    container_name: og
    build:
      context: ./dev/og
    env_file: ./.env
    volumes:
      - og-ollama-data:/root/.ollama
    networks:
      internal_net:
      external_net: {}

  # Gopher - test runner and doc generator, one Streamlit dashboard:
  #   - Tests/Targets: HTTP/TCP checks against this cluster's containers,
  #     probed over the networks gopher shares with them.
  #   - Docs/Reports: API docs generated from this workspace's source with
  #     each language's own doc tool (go doc, typedoc, pdoc), written to a
  #     volume - never back into the repo - and reported on by LLM agents
  #     that run in gopher-agents below, never in here.
  # This container holds the Docker socket and the workspace source; the
  # agents' container holds neither.
  gopher:
    image: dev:gopher
    profiles: [gopher]
    container_name: gopher
    build:
      context: ./dev/gopher
    env_file: ./.env
    environment:
      - GOPHER_SOURCE_DIR=/home/${USER}/projects/${PROJECT}
      # dood's plain NATS client listener (dev/dood/server/nats.go),
      # reachable by its container name on internal_net.
      - GOPHER_NATS_URL=nats://dood:4222
      # Report runs go to gopher-agents below; agents never run in here.
      - GOPHER_AGENTS_URL=http://gopher-agents:8519
    volumes:
      - /home/$USER/projects/$PROJECT:/home/$USER/projects/$PROJECT:ro
      # Generated docs - everything here is served, so the agents can read it.
      - gopher-docs:/data
      # Checks and their results, doc-run history and report runs - kept off
      # /data. It's gopher's pre-merge data volume, so its checks carry over.
      - gopher-data:/state
      # One-time migration of carol's history and reports into /state (see
      # dev/gopher/entrypoint.sh). Drop this, and carol-state below, once
      # gopher has started with it.
      - carol-state:/legacy/carol:ro
      # Targets tab. :ro doesn't limit the Docker API - this is full control
      # of the host's daemon, which is why only this container gets it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Gopher's settings and prompt presets (dev/gopher/server/settings.py),
      # in the same host config dir dood mounts as /etc/d8z - but only this
      # one file, since the rest of it holds tokens and keys. Create it
      # first (even empty): a missing source becomes a root-owned directory.
      - ${D8Z_CONFIG_DIR:-/home/$USER/.d8z}/gopher.yaml:/etc/d8z/gopher.yaml
    depends_on: [gopher-agents]
    networks:
      internal_net:
      external_net: {}

  # Gopher's agent runner (dev/gopher/server/agent_runner.py): the LLM CLIs
  # behind gopher's Reports tab run here, not in gopher, so they can't stray
  # outside the generated docs. They read the docs only as plain text from
  # gopher's doc server (http://gopher:8502/.../docs/...?format=text), so this
  # mounts nothing at all - no docs, no workspace source, no gopher state, no
  # Docker socket - and gets the LLM keys alone, not the whole .env. Each
  # CLI's own limits (curl to the doc server, nothing else) are in
  # dev/gopher/agent-config/.
  gopher-agents:
    image: dev:gopher
    profiles: [gopher]
    container_name: gopher-agents
    build:
      context: ./dev/gopher
    working_dir: /app
    entrypoint: ["python3", "-m", "server.agent_runner"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CODEX_API_KEY=${CODEX_API_KEY:-}
    networks:
      internal_net:
      external_net: {}

  # ---------------------------------------------------------------------
  # Templates - never started from this file.
  # ---------------------------------------------------------------------

  # Extends-template for a gateway bundle's own dind sidecar
  # (dev/dood/bundle/compose.yaml) - only image/environment/healthcheck
  # are actually inherited; everything else is overridden per bundle.
  dind:
    image: docker:27-dind
    container_name: dind
    profiles: [dind]
    privileged: true
    command: ["--host=unix:///var/run/docker.sock", "--host=unix:///var/run/dind/docker.sock"]
    environment:
      - DOCKER_TLS_CERTDIR=    # no TLS (and no auto tcp:2376 listener); sockets only
    volumes:
      - /home/$USER/projects:/home/$USER/projects
      - dind-sock:/var/run/dind
      - dind-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      retries: 30
    networks:
      - external_net

networks:
  internal_net:
    internal: true
    name: internal_net
  external_net:
    driver: bridge
    name: external_net

volumes:
  og-ollama-data:
  gopher-data:
  gopher-docs:
  carol-state:   # migration only - see gopher's volumes
  dind-sock:
  dind-data:
  d8z-nats:
