# The d8z-cloud-environment is a set of Docker containers to get you up and running 
# in the cloud quickly.  It utilizes simple containers that can run in a container optimized
# OS.  Included is a sample development environment with VNC, VScode and VoidEditor with
# AI Agents enabled via API_KEYS routed through a local ollama proxy server.
#
# Profiles pick who launches the system:
#   docker compose up                  - traefik (+dozzle), unconditionally -
#                                        the entry point. Project/container/
#                                        subcluster management lives in its
#                                        gw-server console from here on.
#   docker compose --profile local up  - also starts the rest of the dev
#                                        services directly (deightz, the
#                                        ollama gateway, otel, gopher)
#                                        without using the console's
#                                        container management.
#
# GitHub and Docker Hub actions run natively inside gw-server (its
# Deployment page). Only GCP still uses a tool container: `cloud`, below,
# run one-shot per job (`compose run`), never started with `up`.
#
# dood (the old terminal CLI/dashboard/MCP control plane) and its dind
# sidecar pairing are gone - gw-server replaced them. The `dind` service
# below stays: a spawned gateway's own isolated bundle (dev/traefik/bundle)
# extends its image/environment/healthcheck to run its own dind sidecar;
# nothing starts this root-level copy directly any more.

services:
  # GCP tool container: gcloud SDK + deploy/cloud's shell commands. gw-server
  # runs it one-shot per GCP job (`compose --profile deploy run --rm cloud
  # <cmd>`); nothing keeps it running.
  cloud:
    image: deploy:cloud
    profiles: [deploy]
    build:
      context: .
      dockerfile: ./deploy/cloud/Dockerfile
    env_file: ./.env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/creds.json
    volumes:
      - /home/$USER/projects/$PROJECT:/home/$USER/projects/$PROJECT
      # Needs GOOGLE_APPLICATION_CREDENTIALS_PATH in .env, pointing at a real
      # GCP service-account key file on the host - gw-server's cloud jobs
      # fail check_vars without it. The /dev/null default keeps the file
      # parseable when it's unset.
      - ${GOOGLE_APPLICATION_CREDENTIALS_PATH:-/dev/null}:/app/creds.json:ro
    networks:
      - external_net

  # Pure extends-template for a gateway bundle's own dind sidecar
  # (dev/traefik/bundle/compose.yaml) - only image/environment/healthcheck
  # are actually inherited; everything else is overridden per bundle. Kept
  # in its own `dind` profile so it's never started directly.
  dind:
    image: docker:27-dind
    container_name: dind
    profiles: [dind]
    privileged: true
    command: ["--host=unix:///var/run/docker.sock", "--host=unix:///var/run/dind/docker.sock"]
    environment:
      - DOCKER_TLS_CERTDIR=    # no TLS (and no auto tcp:2376 listener); sockets only
    volumes:
      - /home/$USER/projects:/home/$USER/projects
      - dind-sock:/var/run/dind
      - dind-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      retries: 30
    networks:
      - external_net

# Development environment containers.

  # Traefik is the front door (root gateway): terminates :80, applies basic
  # auth, serves the React console at `/` (sidebar + iframes) and routes
  # /deightz /og /dozzle per dev/traefik/dynamic/base.yml. Its
  # gw-server is the cluster's one control plane: it spawns/stops child
  # gateway bundles (dev/traefik/bundle) mounted at /gw/<name>/ - the
  # cascade - on the daemon it runs on (the host's, or a dind sidecar for an
  # isolated child); manages this project's own local services
  # (deightz, the ollama gateway, otel, gopher); runs the Deployment jobs
  # (GitHub/Docker Hub natively, GCP via `cloud`); and provisions
  # + starts sibling projects under projects/ (self-template or git clone).
  # Context is the repo root: the image carries the repo in /self to build
  # and start bundles from, and to seed new self-template projects.
  traefik:
    image: dev:traefik
    container_name: traefik
    build:
      context: .
      dockerfile: ./dev/traefik/Dockerfile
    env_file: ./.env   # passed on to child bundles (regenerated as /self/.env)
    environment:
      - TRAEFIK_USER=${USER}
      - TRAEFIK_PASSWORD=${DOCKER_PASSWORD}
      - GW_ROLE=root
      - GW_PROJECTS_ROOT=/home/${USER}/projects
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/$USER/projects:/home/$USER/projects
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:80"   # http://localhost:8080 (port 80 itself is reserved elsewhere on this host for now)
    networks:
      internal_net:
      external_net: {}   # internal_net alone is `internal: true` and silently drops the port publish

  # A Docker Log watcher.
  dozzle:
    image: amir20/dozzle
    container_name: dozzle
    environment:
      - DOZZLE_BASE=/dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal_net
      - external_net

# Deightz - streamlined IDE: linuxserver/code-server + claude/codex/gemini/continue CLIs, no VNC desktop.
  deightz:
    image: dev:deightz
    profiles: [local]
    container_name: deightz
    build:
      context: ./dev/deightz
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PASSWORD=${CODE_SERVER_PASSWORD}
      - SUDO_PASSWORD=${DOCKER_PASSWORD}
      - DEFAULT_WORKSPACE=/home/${USER}/projects/${PROJECT}
    env_file: ./.env
    volumes:
      - /home/$USER/projects/$PROJECT:/home/$USER/projects/$PROJECT
      - /var/run/docker.sock:/var/run/docker.sock # For DinD
    privileged: true
    networks:
      - internal_net
      - external_net

# Ollama Gateway - local Ollama runtime + Streamlit dashboard (chat + model management)
  ollama-gatewai:
    image: dev:og
    profiles: [local]
    container_name: og
    build:
      context: ./dev/og
    env_file: ./.env
    volumes:
      - og-ollama-data:/root/.ollama
    networks:
      internal_net:
      external_net: {}

# OpenTelemetry Collector
  otel-collector:
    image: dev:otel-collector
    profiles: [local]
    container_name: otel-collector
    build: ./dev/otel-collector
    volumes:
      - /home/doughznutz/OtelJournal:/var/lib/otel
    env_file: ./.env
    networks:
      - internal_net

# Gopher - test runner: a Streamlit dashboard to enumerate this cluster's
# containers, define HTTP/TCP checks against them, and run/track results.
  gopher:
    image: dev:gopher
    profiles: [local]
    container_name: gopher
    build:
      context: ./dev/gopher
    env_file: ./.env
    volumes:
      - gopher-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      internal_net:
      external_net: {}

networks:
  internal_net:
    internal: true
    name: internal_net
  external_net:
    driver: bridge
    name: external_net

volumes:
  og-ollama-data:
  gopher-data:
  dind-sock:
  dind-data:

