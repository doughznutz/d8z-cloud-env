http:
  middlewares:
    console-auth:
      basicAuth:
        usersFile: /etc/traefik/users
    # Sub-apps use relative asset URLs, so `/deightz` must become `/deightz/`.
    add-trailing-slash:
      redirectRegex:
        regex: "^(https?://[^/]+/(dood|deightz|og|dozzle))$"
        replacement: "${1}/"
        permanent: true
    deightz-strip:
      stripPrefix:
        prefixes:
          - /deightz

  routers:
    console:
      rule: "Path(`/`) || Path(`/index.html`)"
      entryPoints:
        - web
      middlewares:
        - console-auth
      service: console
    deightz:
      rule: "PathPrefix(`/deightz`)"
      entryPoints:
        - web
      middlewares:
        - console-auth
        - add-trailing-slash
        - deightz-strip
      service: deightz
    og:
      rule: "PathPrefix(`/og`)"
      entryPoints:
        - web
      middlewares:
        - console-auth
        - add-trailing-slash
      service: og
    dood:
      rule: "PathPrefix(`/dood`)"
      entryPoints:
        - web
      middlewares:
        - console-auth
        - add-trailing-slash
      service: dood
    dozzle:
      rule: "PathPrefix(`/dozzle`)"
      entryPoints:
        - web
      middlewares:
        - console-auth
        - add-trailing-slash
      service: dozzle

  services:
    console:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8000"
    deightz:
      loadBalancer:
        servers:
          - url: "http://deightz:8443"
    og:
      loadBalancer:
        servers:
          - url: "http://og:8501"
    dood:
      loadBalancer:
        servers:
          # DOOD_HOST: `dood` when dood joins internal_net (host socket),
          # host.docker.internal when it shares the dind sidecar's netns.
          - url: 'http://{{ env "DOOD_HOST" | default "dood" }}:8501'
    dozzle:
      loadBalancer:
        servers:
          - url: "http://dozzle:8080"
