[supervisord]
nodaemon=true

[program:continue]
# Add cloud mcp continue-yaml endpoint retrieval.
command=bash -c 'curl http://og:11434/continue-yaml > ~/.continue/config.yaml'
autostart=true
autorestart=false
user=%(ENV_USER)s
stderr_logfile=/var/log/continue.err.log
stdout_logfile=/var/log/continue.out.log