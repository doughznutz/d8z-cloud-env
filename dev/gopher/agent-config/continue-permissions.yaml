# Continue CLI (cn) tool policy for gopher's report runs: the generated docs,
# read only as plain text from gopher's doc server with curl - nothing else.
# Installed as the gopher-agent user's ~/.continue/permissions.yaml (see
# dev/gopher/Dockerfile).

# The one thing allowed: curl against gopher's doc server.
allow:
  - Bash(curl -s 'http://gopher:8502/*)
  - Bash(curl -s "http://gopher:8502/*)
  - Bash(curl -s http://gopher:8502/*)

# Nothing prompts: headless runs (-p) can't answer a prompt anyway, so
# anything not allowed above is effectively denied.
ask: []

# Tools the model never sees: no file access, no changes, no web.
exclude:
  - Read
  - List
  - Search
  - Write
  - Edit
  - MultiEdit
  - Fetch
