# Codex config for gopher's report runs. Installed as the gopher-agent user's
# ~/.codex/config.toml (see dev/gopher/Dockerfile).
#
# Codex has no per-path read rules: its only file boundary is its own
# sandbox (bubblewrap), which can't create user namespaces inside Docker,
# so it's turned off here. What confines codex to the docs is the
# gopher-agents container itself: its only mount is the docs volume,
# read-only - the workspace source isn't there to read.
sandbox_mode = "danger-full-access"
approval_policy = "never"

# Commands codex runs get a minimal environment: never the API keys.
[shell_environment_policy]
inherit = "core"
exclude = ["*KEY*", "*TOKEN*", "*SECRET*", "*PASSWORD*"]

# Codex forces a read-only sandbox on any project it doesn't trust (which,
# here, means bubblewrap, which can't run) - so its working directory (an
# empty scratch dir, see server/agents.py AGENT_WORKDIR) is trusted.
[projects."/var/lib/gopher-agent/work"]
trust_level = "trusted"
